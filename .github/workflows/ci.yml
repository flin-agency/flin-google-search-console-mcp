name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install bundle tooling
        run: npm ci --ignore-scripts

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output audit-requirements.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps -r audit-requirements.txt

      - name: Run tests
        run: uv run --locked python -m pytest

      - name: Compile source
        run: uv run --locked python -m compileall src scripts

      - name: Check plugin source copies and manifest
        run: |
          uv run --locked python scripts/build_plugin.py --check
          node node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs plugin validate plugin --strict
        env:
          DISABLE_AUTOUPDATER: "1"
          DISABLE_TELEMETRY: "1"

      - name: Build package
        run: uv build --out-dir dist/python

      - name: Build desktop extension
        run: uv run --locked python scripts/build_mcpb.py

      - name: Test packaged extension
        run: uv run --locked python scripts/check_mcpb.py dist/mcpb

      - name: Build and test Claude Code plugin
        run: |
          uv run --locked python scripts/build_plugin.py
          uv run --locked python scripts/check_plugin.py dist/plugin
