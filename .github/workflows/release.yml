name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Also publish the Python distribution to PyPI (run on a version tag)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install bundle tooling
        run: npm ci --ignore-scripts

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output audit-requirements.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps -r audit-requirements.txt

      - name: Run tests
        run: uv run --locked python -m pytest

      - name: Check plugin source copies and manifest
        run: |
          uv run --locked python scripts/build_plugin.py --check
          node node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs plugin validate plugin --strict
        env:
          DISABLE_AUTOUPDATER: "1"
          DISABLE_TELEMETRY: "1"

      - name: Build package
        run: uv build --out-dir dist/python

      - name: Build desktop extension and validate release version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            uv run --locked python scripts/build_mcpb.py --tag "$GITHUB_REF_NAME"
            uv run --locked python scripts/build_plugin.py --tag "$GITHUB_REF_NAME"
          else
            uv run --locked python scripts/build_mcpb.py
            uv run --locked python scripts/build_plugin.py
          fi

      - name: Test packaged extension
        run: uv run --locked python scripts/check_mcpb.py dist/mcpb

      - name: Test packaged Claude Code plugin
        run: uv run --locked python scripts/check_plugin.py dist/plugin

      - name: Upload Python distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-dist
          path: dist/python/*
          if-no-files-found: error

      - name: Upload desktop extension
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-extension
          path: dist/mcpb/*
          if-no-files-found: error

      - name: Upload Claude Code plugin
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: claude-code-plugin
          path: dist/plugin/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && inputs.publish_pypi == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flin-google-search-console-mcp
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: dist/python

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/python/

  publish-github:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-dist
          path: release-assets

      - name: Download desktop extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-extension
          path: release-assets

      - name: Download Claude Code plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: claude-code-plugin
          path: release-assets

      - name: Create release with installation downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
